{% extends "base.html" %}

{% block title %}{% if category %}Editar categoria{% else %}Nova categoria{% endif %}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{% if category %}Editar categoria{% else %}Nova categoria{% endif %}</h1>
    <a href="{{ url_for('category.list_categories') }}" class="btn btn-ghost">Voltar à listagem</a>
</div>

{% if error %}
<div class="alert alert-error alert-narrow">{{ error }}</div>
{% endif %}

<div class="card card-narrow">
    <form method="POST" action="{{ form_action }}">
        <div class="form-group">
            <label for="name" class="form-label">Nome</label>
            <input type="text" id="name" name="name" value="{{ name or (category.name if category else '') }}"
                placeholder="Ex: Alimentação" required autocomplete="off" class="form-control">
        </div>

        <div class="form-group">
            <label for="type" class="form-label">Tipo</label>
            <select id="type" name="type" required class="form-control">
                <option value="" disabled {% if not selected_type %}selected{% endif %}>Selecione o tipo</option>
                {% for type_, label in type_labels.items() %}
                <option value="{{ type_.value }}" {% if type_ == selected_type %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-success btn-lg">Salvar</button>
        </div>
    </form>
</div>
{% endblock %}
