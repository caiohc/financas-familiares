{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Dashboard</h1>
</div>

<div class="card card-flush">
    <table class="data-table">
        <thead>
            <tr>
                <th>Entidade</th>
                <th class="col-count">Quantidade</th>
            </tr>
        </thead>
        <tbody>
            {% for label, count, list_url in entities %}
            <tr>
                <td><a href="{{ list_url }}" class="entity-link">{{ label }}</a></td>
                <td class="col-count count-value">{{ count }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
