{% extends "base.html" %}

{% block title %}{% if family %}Editar família{% else %}Nova família{% endif %}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{% if family %}Editar família{% else %}Nova família{% endif %}</h1>
    <a href="{{ url_for('family.list_families') }}" class="btn btn-ghost">Voltar à listagem</a>
</div>

{% if error %}
<div class="alert alert-error alert-narrow">{{ error }}</div>
{% endif %}

<div class="card card-narrow">
    <form method="POST" action="{{ form_action }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="name" class="form-label">Nome</label>
            <input type="text" id="name" name="name" value="{{ name or (family.name if family else '') }}"
                placeholder="Ex: Família Silva" required autocomplete="off" class="form-control">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-success btn-lg">Salvar</button>
        </div>
    </form>
</div>
{% endblock %}
