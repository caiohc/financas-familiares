{% extends "base.html" if current_user.is_authenticated else "auth/base_auth.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="card card-narrow">
    <h1 class="auth-title">{{ title }}</h1>
    <p>{{ message }}</p>
    <p class="auth-links">
        {% if current_user.is_authenticated %}
        <a href="{{ url_for('dashboard.index') }}">Voltar ao início</a>
        {% else %}
        <a href="{{ url_for('auth.login') }}">Ir para a tela de entrada</a>
        {% endif %}
    </p>
</div>
{% endblock %}
