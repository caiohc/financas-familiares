[project]
name = "financas-familiares"
version = "0.1.0"
description = "Aplicação para controle financeiro familiar"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "flask>=3.1.3",
    "flask-limiter>=4.1.1",
    "flask-login>=0.6.3",
    "flask-wtf>=1.3.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.52",
]

[tool.pytest.ini_options]
pythonpath = [
  "src",
  "tests"
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]
